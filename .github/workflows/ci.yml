name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # -----------------------------------------------------------------------
  # Job 1 — Lint (Fase 5.1): black + isort + flake8
  # -----------------------------------------------------------------------
  lint:
    name: Lint (black, isort, flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8

      - name: black --check
        run: black --check api etl scripts tests

      - name: isort --check
        run: isort --check-only api etl scripts tests

      - name: flake8
        run: flake8 api etl scripts tests

  # -----------------------------------------------------------------------
  # Job 2 — Testes unitários com gate de cobertura ≥65% (Milestone F1)
  # -----------------------------------------------------------------------
  test:
    name: Tests + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.prod.txt
          pip install pytest pytest-cov fakeredis

      - name: Run unit tests (sem integração de rede/banco)
        run: >
          python -m pytest tests/ -q
          --ignore=tests/test_endpoints.py
          --ignore=tests/test_pipeline.py
          --cov=api --cov=etl --cov-report=term-missing
          --cov-fail-under=0

      - name: Coverage gate >= 65%
        run: >
          python -m pytest tests/ -q
          --ignore=tests/test_endpoints.py
          --ignore=tests/test_pipeline.py
          --cov=api --cov=etl --cov-report=term
          --cov-fail-under=65

  # -----------------------------------------------------------------------
  # Job 3 — Integração E2E: MySQL+Redis via services, backend real na :8002
  # (substitui o antigo job monolítico que dependia de download da ANS;
  #  usa seed sintético para não quebrar CI quando a ANS mudar o layout)
  # -----------------------------------------------------------------------
  integration:
    name: Integration (MySQL + Redis + API live)
    runs-on: ubuntu-latest
    needs: [lint, test]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ans_db
          MYSQL_USER: user
          MYSQL_PASSWORD: password
        ports: ["3307:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=8
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.prod.txt
          pip install pytest pytest-cov fakeredis

      - name: Apply DDL MySQL
        run: |
          sudo apt-get update && sudo apt-get install -y mysql-client
          mysql -h 127.0.0.1 -P 3307 -uuser -ppassword ans_db < db/mysql/01_ddl.sql

      - name: Seed dados sintéticos v1.2 (todas as dimensões)
        run: python scripts/seed_ci.py

      - name: Start backend (uvicorn :8002)
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3307"
          MYSQL_USER: user
          MYSQL_PASSWORD: password
          MYSQL_DATABASE: ans_db
          REDIS_HOST: 127.0.0.1
        run: |
          nohup python -m uvicorn api.main:app --host 127.0.0.1 --port 8002 > uvicorn.log 2>&1 &
          for i in {1..30}; do
            curl -sf http://127.0.0.1:8002/health >/dev/null && echo "backend healthy" && break
            sleep 2
          done

      - name: Run integration tests
        env:
          RUN_INTEGRATION: "1"
          API_BASE_URL: http://127.0.0.1:8002
        run: python -m pytest tests/test_endpoints.py -q --no-cov

      - name: Upload uvicorn log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uvicorn-log
          path: uvicorn.log

  # -----------------------------------------------------------------------
  # Job 4 — Build da imagem Docker multi-stage (Fase 5.2), sem push
  # -----------------------------------------------------------------------
  docker-build:
    name: Docker build smoke
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -f docker/backend/Dockerfile --target production -t ans-backend:ci .
      - name: Report image size
        run: docker images ans-backend:ci --format "{{.Size}}"
