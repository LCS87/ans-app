[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=api
    --cov-report=term-missing
    --cov-fail-under=15
markers =
    smoke: quick health checks
    integration: integration tests that may download data or require system deps
    slow: Testes lentos
filterwarnings =
    ignore::DeprecationWarning

